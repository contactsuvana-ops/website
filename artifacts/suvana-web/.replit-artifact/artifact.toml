kind = "web"
previewPath = "/"
title = "Suvana Constructions"
version = "1.0.0"
id = "artifacts/suvana-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23395

[services.development]
run = "pnpm --filter @workspace/suvana-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/suvana-web", "run", "build" ]
publicDir = "artifacts/suvana-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23395"
BASE_PATH = "/"
