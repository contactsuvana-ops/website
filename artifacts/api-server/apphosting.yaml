# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run

runConfig:
  minInstances: 0
  maxInstances: 10
  environmentVariables:
    - variable: NODE_ENV
      value: production
    - variable: PORT
      value: "8080"
